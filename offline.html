<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1C2541" />
  <title>eHub Offline — Academic CBT</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F3F6FB; color: #1E293B; margin: 0; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
    .card { background: #fff; padding: 36px; border-radius: 20px; max-width: 480px; width: 100%; box-shadow: 0 12px 30px rgba(0,0,0,0.06); text-align: center; }
    .brand { font-size: 32px; font-weight: 800; color: #1C2541; margin-bottom: 16px; }
    .brand span { color: #2196F3; font-style: italic; }
    .brand b { background: #FF9800; color: #fff; padding: 3px 12px; border-radius: 14px; font-size: 20px; margin-left: 2px; }
    .badge { display: inline-block; background: #FEF3C7; color: #B45309; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 18px; }
    h2 { margin: 8px 0; font-size: 22px; }
    p { color: #64748B; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .btn { display: inline-block; background: #2563EB; color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 10px; font-weight: 600; font-size: 15px; border: none; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #1D4ED8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span>e</span><b>hub</b></div>
    <div class="badge">Offline Storage Ready</div>
    <h2>Academic Session Preserved</h2>
    <p>You are currently operating in offline mode. Your answered CBT tests, lecture materials, and exam drafts remain securely stored locally.</p>
    <button class="btn" onclick="window.location.reload()">Reload Application</button>
  </div>
</body>
</html>
